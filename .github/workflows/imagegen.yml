name: ImageGen

on:
  workflow_dispatch:

permissions:
  # write: il servizio salva nel repository posizioni di Probabile XI e numeri di maglia.
  contents: write
  actions: write

concurrency:
  group: imagegen-jr
  cancel-in-progress: false

jobs:
  generator:
    name: Generatore manuale
    runs-on: ubuntu-latest
    # Sessione fino a 60 minuti (service.py, SESSION_MAX_SECONDS) + avvio e pulizia.
    timeout-minutes: 65
    env:
      # Scontorno fine delle fasi con foto (grafica finale): BiRefNet lite, attesa massima 20 s poi ISNet.
      # Provato birefnet-portrait: 30-45 s a foto ma il server finisce la memoria (servizio "Killed").
      PHASE_FINE_MODEL: birefnet-general-lite
      PHASE_FINE_WAIT: '20'

    steps:
      - name: Checkout ImageGEN JR
        uses: actions/checkout@v6

      - name: Checkout motore grafico LiveScore JR
        uses: actions/checkout@v6
        with:
          repository: Tommaso20BW/LiveScore_JR
          path: _graphics_core
          sparse-checkout: |
            /livescore/
            /data/
          sparse-checkout-cone-mode: false

      - name: Checkout asset privati (foto, font, loghi)
        uses: actions/checkout@v6
        with:
          repository: Tommaso20BW/LiveScore_Assets_JR
          token: ${{ secrets.ASSETS_PAT }}
          path: _private_assets

      - name: Installa asset privati
        shell: bash
        run: |
          mkdir -p _graphics_core/assets/goal_graphics
          cp -a _private_assets/players _private_assets/fonts _private_assets/team_logos _private_assets/overlays _private_assets/portrait _private_assets/word_textures _private_assets/canva _graphics_core/assets/goal_graphics/
          # Correzioni squadre dalla mini app ImageGen (fuori da team_logos/: la sync FCLogo non le tocca).
          if [ -d _private_assets/team_overrides ]; then cp -a _private_assets/team_overrides _graphics_core/assets/goal_graphics/; fi
          # Bandiere delle nazionali (grafica Convocati): flag-icons, licenza MIT.
          if [ -d _private_assets/flags ]; then cp -a _private_assets/flags _graphics_core/assets/goal_graphics/; fi
          # Foto ufficiali dei giocatori dal sito della Lega Serie A (app/foto_lega.py).
          if [ -d _private_assets/players_lega ]; then cp -a _private_assets/players_lega _graphics_core/assets/goal_graphics/; fi
          # Ultimi invii e frasi pronte della Storia IG (salvati dalla mini app, app/sent_store.py).
          if [ -d _private_assets/imagegen ]; then cp -a _private_assets/imagegen _graphics_core/assets/goal_graphics/; fi

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa dipendenze Python
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt

      # Modello di scontorno (HALF/END/FULL TIME): scaricato una volta, poi dalla cache.
      - name: Cache modello scontorno
        uses: actions/cache@v6
        with:
          path: ~/.rembg
          key: rembg-isnet-birefnet-lite-v1

      - name: Prepara Chrome per le grafiche
        shell: bash
        run: |
          set -euo pipefail
          log() { printf '[%s] %-6s %-10s | %s\n' "$(TZ=Europe/Rome date +%H:%M:%S)" "$1" "$2" "$3"; }

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"

          if [ -n "$CHROME" ]; then
            log INFO CHROME "Chrome di sistema: $CHROME"
            echo "IMAGEGEN_CHROME=$CHROME" >> "$GITHUB_ENV"
            python - "$CHROME" <<'PY'
          from pathlib import Path
          import sys

          chrome = sys.argv[1]
          path = Path("_graphics_core/livescore/graphics/stats.py")
          text = path.read_text(encoding="utf-8")

          old = "browser = playwright.chromium.launch()"
          new = f"browser = playwright.chromium.launch(executable_path={chrome!r})"

          if old not in text:
              raise SystemExit("Riga Playwright non trovata in livescore/graphics/stats.py")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          else
            log WARN CHROME "Chrome di sistema non trovato: installo Chromium (Playwright)"
            playwright install --with-deps chromium
          fi

      - name: Attendi aggiornamento GitHub Pages
        shell: bash
        env:
          WEBAPP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          log() { printf '[%s] %-6s %-10s | %s\n' "$(TZ=Europe/Rome date +%H:%M:%S)" "$1" "$2" "$3"; }

          EXPECTED="$(sha256sum index.html | awk '{print $1}')"
          ACTUAL=""

          log INFO PAGES "Attendo la Mini App di questo commit su GitHub Pages"

          for ATTEMPT in $(seq 1 36); do
            URL="${WEBAPP_URL}?v=${GITHUB_SHA}&check=${ATTEMPT}"

            if curl -fsSL \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "$URL" \
              -o /tmp/imagegen_pages.html; then

              ACTUAL="$(sha256sum /tmp/imagegen_pages.html | awk '{print $1}')"

              if [ "$ACTUAL" = "$EXPECTED" ]; then
                log INFO PAGES "Mini App aggiornata (prova ${ATTEMPT})"
                exit 0
              fi
            fi

            if [ $((ATTEMPT % 6)) -eq 0 ]; then
              log INFO PAGES "Ancora la versione vecchia · prova ${ATTEMPT}/36"
            fi
            sleep 5
          done

          log ERROR PAGES "GitHub Pages non ha pubblicato la Mini App di questo commit"
          echo "::error title=GitHub Pages::La Mini App di questo commit non è ancora pubblicata."
          exit 1

      - name: Sessione ImageGen (tunnel e Telegram)
        shell: bash
        env:
          MANUAL_GRAPHICS_TELEGRAM_TOKEN: ${{ secrets.MANUAL_GRAPHICS_TELEGRAM_TOKEN }}
          MANUAL_GRAPHICS_TELEGRAM_CHAT_ID: ${{ secrets.MANUAL_GRAPHICS_TELEGRAM_CHAT_ID }}
          MANUAL_GRAPHICS_WEBAPP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?v=${{ github.sha }}
          # Token del workflow (contents: write): il secret IMAGEGEN_GH_PAT poteva solo leggere
          # (403 in scrittura), quindi posizioni e numeri di maglia non venivano mai salvati.
          IMAGEGEN_GH_PAT: ${{ github.token }}
          # Impostazioni › Squadre e loghi: le correzioni vanno nel repo degli asset (serve scrittura).
          IMAGEGEN_ASSETS_PAT: ${{ secrets.ASSETS_PAT }}
          IMAGEGEN_ASSETS_REPO: Tommaso20BW/LiveScore_Assets_JR
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}/app:${{ github.workspace }}/_graphics_core
        run: |
          set -euo pipefail

          PORT=8765
          log() { printf '[%s] %-6s %-10s | %s\n' "$(TZ=Europe/Rome date +%H:%M:%S)" "$1" "$2" "$3"; }
          CLOUDFLARED="${RUNNER_TEMP}/cloudflared"
          LOG="${RUNNER_TEMP}/cloudflared.log"

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$CLOUDFLARED"
          chmod +x "$CLOUDFLARED"

          TUNNEL_PID=""
          cleanup_tunnel() {
            if [ -n "$TUNNEL_PID" ]; then
              kill "$TUNNEL_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_tunnel EXIT

          # Tunnel nuovo: l'indirizzo esce nel log. Funzionante davvero lo verifica
          # il servizio (da internet) prima di mandare il pulsante su Telegram.
          start_tunnel() {
            cleanup_tunnel
            : >"$LOG"
            "$CLOUDFLARED" tunnel \
              --url "http://127.0.0.1:${PORT}" \
              --no-autoupdate \
              >"$LOG" 2>&1 &
            TUNNEL_PID=$!
            TUNNEL_URL=""
            for _ in $(seq 1 50); do
              TUNNEL_URL="$(grep -Eo 'https://[A-Za-z0-9-]+\.trycloudflare\.com' "$LOG" | head -n 1 || true)"
              if [ -n "$TUNNEL_URL" ]; then
                break
              fi
              if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
                break
              fi
              sleep 0.4
            done
            [ -n "$TUNNEL_URL" ]
          }

          export IMAGEGEN_DIRECT_PORT="$PORT"
          STATUS=1
          for ATTEMPT in 1 2 3; do
            if ! start_tunnel; then
              log WARN TUNNEL "Tunnel $ATTEMPT/3 non avviato"
              cat "$LOG" || true
              continue
            fi
            export MANUAL_GRAPHICS_DIRECT_URL="$TUNNEL_URL"
            log INFO TUNNEL "Tunnel $ATTEMPT/3 creato · controllo che risponda prima del pulsante"

            # Se il run viene annullato, lo stop arriva sempre a Python, che
            # chiude la sessione e cancella i messaggi prima di uscire.
            python -u app/service.py &
            SERVICE_PID=$!
            trap 'kill -TERM "$SERVICE_PID" 2>/dev/null || true' INT TERM
            set +e
            wait "$SERVICE_PID"
            STATUS=$?
            while kill -0 "$SERVICE_PID" 2>/dev/null; do
              wait "$SERVICE_PID"
              STATUS=$?
            done
            set -e
            # 75 = tunnel mai raggiungibile da internet: se ne apre uno nuovo.
            if [ "$STATUS" -ne 75 ]; then
              exit "$STATUS"
            fi
            log WARN TUNNEL "Tunnel $ATTEMPT/3 non raggiungibile · ne apro uno nuovo"
          done
          log ERROR TUNNEL "Nessun tunnel raggiungibile dopo 3 tentativi"
          echo "::error title=Tunnel::Nessun tunnel raggiungibile dopo 3 tentativi."
          exit 1

      - name: Elimina vecchi run ImageGen e Pages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          log() { printf '[%s] %-6s %-10s | %s\n' "$(TZ=Europe/Rome date +%H:%M:%S)" "$1" "$2" "$3"; }

          CURRENT_RUN_ID="${{ github.run_id }}"
          IMAGEGEN_DELETED=0
          PAGES_DELETED=0

          while read -r RUN_ID; do
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$CURRENT_RUN_ID" ]; then
              if gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID" >/dev/null 2>&1; then
                IMAGEGEN_DELETED=$((IMAGEGEN_DELETED + 1))
              fi
            fi
          done < <(gh api --paginate \
            "repos/${{ github.repository }}/actions/workflows/imagegen.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id')

          while read -r RUN_ID; do
            if [ -n "$RUN_ID" ]; then
              if gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID" >/dev/null 2>&1; then
                PAGES_DELETED=$((PAGES_DELETED + 1))
              fi
            fi
          done < <(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.name == "pages build and deployment" and .status == "completed") | .id')

          log INFO PULIZIA "Vecchi run cancellati · ImageGen ${IMAGEGEN_DELETED} · Pages ${PAGES_DELETED}"
