name: ImageGen

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: imagegen-jr
  cancel-in-progress: false

jobs:
  generator:
    name: Generatore manuale
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout ImageGEN JR
        uses: actions/checkout@v6

      - name: Checkout motore grafico LiveScore JR
        uses: actions/checkout@v6
        with:
          repository: Tommaso20BW/LiveScore_JR
          path: _graphics_core
          sparse-checkout: |
            assets/goal_graphics
            goal_graphics.py
            goal_players.json
            portrait_graphics.py
            stats_graphics.py
            stats.html
            team_matching.py
            teams.json
            live_logging.py
            canva_page_one.py
          sparse-checkout-cone-mode: false

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa dipendenze Python
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Prepara browser per STATS
        shell: bash
        run: |
          set -euo pipefail

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"

          if [ -n "$CHROME" ]; then
            echo "Chrome di sistema trovato: $CHROME"
            python - "$CHROME" <<'PY'
          from pathlib import Path
          import sys

          chrome = sys.argv[1]
          path = Path("_graphics_core/stats_graphics.py")
          text = path.read_text(encoding="utf-8")

          old = "browser = playwright.chromium.launch()"
          new = f"browser = playwright.chromium.launch(executable_path={chrome!r})"

          if old not in text:
              raise SystemExit("Riga Playwright non trovata in stats_graphics.py")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print(f"STATS userà Chrome di sistema: {chrome}")
          PY
          else
            echo "Chrome di sistema non trovato: installo Chromium Playwright come fallback."
            playwright install --with-deps chromium
          fi

      - name: Attendi aggiornamento GitHub Pages
        shell: bash
        env:
          WEBAPP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail

          EXPECTED="$(sha256sum index.html | awk '{print $1}')"
          ACTUAL=""

          echo "Attendo che GitHub Pages pubblichi l'index.html di questo commit..."

          for ATTEMPT in $(seq 1 36); do
            URL="${WEBAPP_URL}?v=${GITHUB_SHA}&check=${ATTEMPT}"

            if curl -fsSL \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "$URL" \
              -o /tmp/imagegen_pages.html; then

              ACTUAL="$(sha256sum /tmp/imagegen_pages.html | awk '{print $1}')"

              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "GitHub Pages aggiornato correttamente."
                exit 0
              fi
            fi

            echo "Pages ancora vecchio | tentativo ${ATTEMPT}/36"
            sleep 5
          done

          echo "ERRORE: GitHub Pages non ha ancora pubblicato l'index.html corrente."
          exit 1

      - name: Avvia endpoint diretto e generatore Telegram
        shell: bash
        env:
          MANUAL_GRAPHICS_TELEGRAM_TOKEN: ${{ secrets.MANUAL_GRAPHICS_TELEGRAM_TOKEN }}
          MANUAL_GRAPHICS_TELEGRAM_CHAT_ID: ${{ secrets.MANUAL_GRAPHICS_TELEGRAM_CHAT_ID }}
          MANUAL_GRAPHICS_WEBAPP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?v=${{ github.sha }}
          IMAGEGEN_CANVA_CLIENT_ID: ${{ secrets.IMAGEGEN_CANVA_CLIENT_ID }}
          IMAGEGEN_CANVA_CLIENT_SECRET: ${{ secrets.IMAGEGEN_CANVA_CLIENT_SECRET }}
          IMAGEGEN_CANVA_REFRESH_TOKEN: ${{ secrets.IMAGEGEN_CANVA_REFRESH_TOKEN }}
          IMAGEGEN_GH_PAT: ${{ secrets.IMAGEGEN_GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/_graphics_core
        run: |
          set -euo pipefail

          PORT=8765
          CLOUDFLARED="${RUNNER_TEMP}/cloudflared"
          LOG="${RUNNER_TEMP}/cloudflared.log"

          echo "Preparo il collegamento diretto della Mini App..."
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$CLOUDFLARED"
          chmod +x "$CLOUDFLARED"

          "$CLOUDFLARED" tunnel \
            --url "http://127.0.0.1:${PORT}" \
            --no-autoupdate \
            >"$LOG" 2>&1 &
          TUNNEL_PID=$!

          cleanup_tunnel() {
            kill "$TUNNEL_PID" 2>/dev/null || true
          }
          trap cleanup_tunnel EXIT

          TUNNEL_URL=""
          for _ in $(seq 1 50); do
            TUNNEL_URL="$(grep -Eo 'https://[A-Za-z0-9-]+\.trycloudflare\.com' "$LOG" | head -n 1 || true)"
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              break
            fi
            sleep 0.4
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERRORE: endpoint diretto non avviato."
            cat "$LOG" || true
            exit 1
          fi

          export MANUAL_GRAPHICS_DIRECT_URL="$TUNNEL_URL"
          export IMAGEGEN_DIRECT_PORT="$PORT"

          echo "Endpoint diretto pronto. LiveScore può restare acceso."
          python -u service.py

      - name: Elimina vecchi run ImageGen e Pages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_RUN_ID="${{ github.run_id }}"

          echo "Pulisco vecchi run di ImageGen..."
          gh api --paginate \
            "repos/${{ github.repository }}/actions/workflows/imagegen.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' |
          while read -r RUN_ID; do
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$CURRENT_RUN_ID" ]; then
              echo "Elimino vecchio run ImageGen $RUN_ID"
              gh api -X DELETE \
                "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
                || true
            fi
          done

          echo "Pulisco vecchi run di pages build and deployment..."
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.name == "pages build and deployment" and .status == "completed") | .id' |
          while read -r RUN_ID; do
            if [ -n "$RUN_ID" ]; then
              echo "Elimino vecchio run Pages $RUN_ID"
              gh api -X DELETE \
                "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
                || true
            fi
          done
