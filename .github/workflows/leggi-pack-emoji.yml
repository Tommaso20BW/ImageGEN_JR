# Temporaneo: legge i pack di emoji personalizzate (codice + miniatura di ogni emoji) per
# le didascalie di ImageGEN. Si avvia a mano; il risultato è nell'artifact "pack-emoji".
name: Leggi pack emoji

on:
  workflow_dispatch:
    inputs:
      packs:
        description: Nomi dei pack (dopo t.me/addemoji/), separati da spazi
        required: false
        default: >-
          AroundJuventus ItalianFootballEmoji EnglishFootball_Emoji EnglishFootball2Emoji
          SpanishFootballEmoji GermanFootballEmoji FrenchFootballEmoji DutchFootballEmoji
          PortugueseFootballEmoji BelgianFootballEmoji TurkishFootballEmoji ScottishFootballEmoji
          GreekFootballEmoji AustrianFootballEmoji SwissFootballEmoji CzechFootballEmoji
          NorwegianFootballEmoji DanishFootballEmoji PolishFootballEmoji SwedishFootballEmoji
          CroatianFootballEmoji SerbianFootballEmoji UkrainianFootballEmoji HungarianFootballEmoji
          RomanianFootballEmoji SlovakFootballEmoji SlovenianFootballEmoji BulgarianFootballEmoji
          CyprusLogos IsraeliFootballEmoji AzerbaijaniFootballEmoji KazakhstaniFootballEmoji
          EuropeanFootballEmoji UEFAChampionsLeagueEmoji UEFAEuropeLeagueEmoji
          UEFAConferenceLeagueEmoji FootballTVEmoji

permissions:
  contents: read

jobs:
  leggi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -q requests
      - name: Leggi i pack
        env:
          TOKEN: ${{ secrets.MANUAL_GRAPHICS_TELEGRAM_TOKEN }}
          PACKS: ${{ inputs.packs }}
        shell: python
        run: |
          import json, os, pathlib, time, requests
          api = f"https://api.telegram.org/bot{os.environ['TOKEN']}/"
          files = api.replace('/bot', '/file/bot', 1)
          out = pathlib.Path('pack-emoji'); (out / 'thumbs').mkdir(parents=True, exist_ok=True)
          rows, errors = [], []
          s = requests.Session()

          def call(method, **params):
              for attempt in range(5):
                  r = s.get(api + method, params=params, timeout=30)
                  if r.status_code == 429:
                      time.sleep(int(r.json().get('parameters', {}).get('retry_after', 3)) + 1)
                      continue
                  body = r.json()
                  if not body.get('ok'):
                      raise RuntimeError(f"{method}: {body.get('description')}")
                  return body['result']
              raise RuntimeError(f'{method}: troppe richieste')

          for pack in os.environ['PACKS'].split():
              try:
                  info = call('getStickerSet', name=pack)
              except Exception as exc:
                  errors.append(f'{pack}: {exc}'); print('ERRORE', pack, exc); continue
              print(pack, '-', info.get('title'), '-', len(info['stickers']), 'emoji', flush=True)
              for i, st in enumerate(info['stickers']):
                  cid = st.get('custom_emoji_id')
                  thumb = (st.get('thumbnail') or {}).get('file_id')
                  kind = 'video' if st.get('is_video') else 'animated' if st.get('is_animated') else 'static'
                  name = ''
                  source = thumb or (st['file_id'] if kind == 'static' else None)
                  if cid and source:
                      try:
                          path = call('getFile', file_id=source)['file_path']
                          ext = path.rsplit('.', 1)[-1]
                          name = f'thumbs/{cid}.{ext}'
                          (out / name).write_bytes(s.get(files + path, timeout=30).content)
                      except Exception as exc:
                          errors.append(f'{pack} #{i}: {exc}')
                  rows.append({'pack': pack, 'title': info.get('title'), 'index': i, 'id': cid,
                               'emoji': st.get('emoji'), 'kind': kind, 'thumb': name})
                  time.sleep(0.04)
          (out / 'packs.json').write_text(json.dumps(rows, ensure_ascii=False, indent=1), encoding='utf-8')
          (out / 'errors.txt').write_text('\n'.join(errors), encoding='utf-8')
          print(len(rows), 'emoji,', len(errors), 'errori')
      - uses: actions/upload-artifact@v6
        with:
          name: pack-emoji
          path: pack-emoji/
          retention-days: 3
