name: Refresh Canva Token

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: imagegen-jr
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh token Canva ImageGEN
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout ImageGEN JR
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa dipendenze Python
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Refresh manuale Canva
        env:
          IMAGEGEN_CANVA_CLIENT_ID: ${{ secrets.IMAGEGEN_CANVA_CLIENT_ID }}
          IMAGEGEN_CANVA_CLIENT_SECRET: ${{ secrets.IMAGEGEN_CANVA_CLIENT_SECRET }}
          IMAGEGEN_CANVA_REFRESH_TOKEN: ${{ secrets.IMAGEGEN_CANVA_REFRESH_TOKEN }}
          IMAGEGEN_GH_PAT: ${{ secrets.IMAGEGEN_GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -u refresh_canva_token.py

      - name: Elimina vecchi run Refresh Canva Token
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_RUN_ID="${{ github.run_id }}"

          gh api --paginate             "repos/${{ github.repository }}/actions/workflows/refresh_canva_token.yml/runs?per_page=100"             --jq '.workflow_runs[] | select(.status == "completed") | .id' |
          while read -r RUN_ID; do
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$CURRENT_RUN_ID" ]; then
              echo "Elimino vecchio run Refresh Canva Token $RUN_ID"
              gh api -X DELETE                 "repos/${{ github.repository }}/actions/runs/$RUN_ID"                 || true
            fi
          done
