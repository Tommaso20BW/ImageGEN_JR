name: ImageGen Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagegen-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa dipendenze
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Controlla sintassi Python
        run: |
          python -m py_compile             canva.py             catalog.py             constants.py             refresh_canva_token.py             render.py             service.py             telegram.py             webapp_payload.py
