name: Cleanup Runs

on:
  workflow_run:
    workflows:
      - ImageGen
      - ImageGen Check
      - Refresh Canva Token
    types:
      - completed

  page_build:

  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: imagegen-cleanup-runs
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep 0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Attendi chiusura completa dei run
        run: sleep 20

      - name: Elimina tutti i run completati
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          while true; do
            RUN_IDS="$(
              gh api "repos/${{ github.repository }}/actions/runs?status=completed&per_page=100"                 --jq '.workflow_runs[].id'
            )"

            if [ -z "$RUN_IDS" ]; then
              echo "Nessun run completato da eliminare."
              break
            fi

            while read -r RUN_ID; do
              if [ -n "$RUN_ID" ]; then
                echo "Elimino run $RUN_ID"
                gh api                   -X DELETE                   "repos/${{ github.repository }}/actions/runs/$RUN_ID"                   || true
              fi
            done <<< "$RUN_IDS"

            sleep 2
          done
