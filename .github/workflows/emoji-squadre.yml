# A ogni nuova stagione FCLogo (come i loghi) rilegge i pack di emoji delle squadre (JR Pack e
# pack @footyemoji). Il lunedi' guarda solo se data/fclogo_manifest.json di LiveScore JR ha cambiato
# stagione: se no si ferma subito. Emoji tolte o nuove: abbinamenti rifatti (solo con compatibilita'
# >= 90%), miniature e mappa aggiornate nel repo degli asset (team_emoji/, team_overrides/emoji.json).
# Avviato a mano controlla sempre.
# Se c'è qualcosa di nuovo il bot di ImageGEN manda il riepilogo su Telegram.
name: Emoji squadre

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      packs:
        description: Pack in più da leggere (nomi dopo t.me/addemoji/, separati da spazi)
        required: false
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: emoji-squadre
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Catalogo squadre (LiveScore JR)
        uses: actions/checkout@v6
        with:
          repository: Tommaso20BW/LiveScore_JR
          path: _graphics_core
          sparse-checkout: /data/
          sparse-checkout-cone-mode: false

      - name: Asset privati
        uses: actions/checkout@v6
        with:
          repository: Tommaso20BW/LiveScore_Assets_JR
          token: ${{ secrets.ASSETS_PAT }}
          path: _private_assets
          sparse-checkout: |
            /team_emoji/
            /team_overrides/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - run: python -m pip install -q requests pillow numpy

      - name: Controlla i pack
        env:
          TOKEN: ${{ secrets.MANUAL_GRAPHICS_TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.MANUAL_GRAPHICS_TELEGRAM_CHAT_ID }}
          PACKS: ${{ inputs.packs }}
        run: python app/tools/emoji_squadre.py _private_assets _graphics_core/data/fclogo_manifest.json $PACKS ${{ github.event_name == 'schedule' && '--nuova-stagione' || '' }}

      - name: Salva le novità nel repo degli asset
        working-directory: _private_assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A team_emoji team_overrides/emoji.json 2>/dev/null || git add -A team_emoji
          if git diff --cached --quiet; then echo 'Nessuna modifica'; exit 0; fi
          git commit -q -m 'Emoji squadre: controllo dei pack per la nuova stagione'
          git pull --rebase -q && git push -q

      - name: Pulisci la cronologia dei run
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/emoji-squadre.yml/runs?status=completed&per_page=100"             --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            if [ -n "$RUN_ID" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID" >/dev/null 2>&1 || true
            fi
          done
          echo "Pulizia completata."
